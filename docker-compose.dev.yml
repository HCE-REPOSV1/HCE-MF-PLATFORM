# docker-compose.dev.yml — Build/deploy SIN Vault
# Valores de producción hardcodeados directamente (snapshot del docker-compose.yml
# previo a la integración con Vault). Uso:
#   docker compose -f docker-compose.dev.yml build
#   docker compose -f docker-compose.dev.yml up -d
#
# Para el flujo normal con Vault, usar docker-compose.yml via
# kv-hce-platform-dev/scripts/deploy-mf.sh (lee los build-args desde Vault).
#
# Variante feature/Sanna: puertos desplazados +50 (10550/20550 en adelante) para
# convivir en el mismo servidor de pruebas de desarrollo con el despliegue base
# (10500/20500), como una segunda versión con diseño distinto (VITE_COMPANY_THEME=sanna).
#
# "name" fija el nombre de proyecto de Compose (prefijo de contenedores y de la
# red default). Sin esto, Compose lo saca del nombre de la carpeta — como ambos
# despliegues corren desde una carpeta llamada igual (HCE-MF-PLATFORM), sus
# contenedores y su red default colisionarían aunque los puertos ya no choquen.
name: hce-mf-platform-sanna

services:
  mf-shell:
    build:
      context: .
      dockerfile: apps/mf-shell/Dockerfile
      args:
        VITE_COMPANY_THEME: sanna
        VERDACCIO_URL: http://192.168.42.44:10100
        # URLs de producción — se hornean en el bundle al compilar
        VITE_APIGW_CNL_CROSS: https://servicios.dev.sanfelipe.com:20601
        VITE_REMOTE_AUTH:        https://servicios.dev.sanfelipe.com:20551/assets/remoteEntry.js
        VITE_REMOTE_HOME:        https://servicios.dev.sanfelipe.com:20552/assets/remoteEntry.js
        VITE_REMOTE_EMERGENCY:   https://servicios.dev.sanfelipe.com:20553/assets/remoteEntry.js
        VITE_REMOTE_HOSPITAL:    https://servicios.dev.sanfelipe.com:20554/assets/remoteEntry.js
        VITE_REMOTE_AMBULATORIO: https://servicios.dev.sanfelipe.com:20555/assets/remoteEntry.js
        VITE_REMOTE_AUDITORIA:   https://servicios.dev.sanfelipe.com:20556/assets/remoteEntry.js
        VITE_REMOTE_HEADER:      https://servicios.dev.sanfelipe.com:20557/assets/remoteEntry.js
        VITE_REMOTE_SIDEBAR:     https://servicios.dev.sanfelipe.com:20558/assets/remoteEntry.js
        VITE_REMOTE_FOOTER:      https://servicios.dev.sanfelipe.com:20559/assets/remoteEntry.js
        VITE_REMOTE_TRIAGE:      https://servicios.dev.sanfelipe.com:20560/assets/remoteEntry.js
        VITE_REMOTE_CLINICAL_RECORD: https://servicios.dev.sanfelipe.com:20561/assets/remoteEntry.js
        VITE_DEFAULT_LOCALE: es
    restart: unless-stopped
    ports:
      - "10550:80"
      - "20550:443"
    environment:
      PORT: "80"
      SSL_PORT: "443"
      USE_SSL: "true"
      CERT_PATH: /proyectos/certs
      NGINX_TYPE: spa
    volumes:
      - /proyectos/certs:/proyectos/certs:ro

  mf-auth:
    build:
      context: .
      dockerfile: apps/mf-auth/Dockerfile
      args:
        VERDACCIO_URL: http://192.168.42.44:10100
        VITE_REMOTE_SHELL: https://servicios.dev.sanfelipe.com:20550/assets/remoteEntry.js
        VITE_APIGW_CNL_CROSS: https://servicios.dev.sanfelipe.com:20601
        VITE_DEFAULT_LOCALE: es
