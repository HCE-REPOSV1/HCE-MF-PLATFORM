# docker-compose.dev.yml — Build/deploy SIN Vault
# Valores de producción hardcodeados directamente (snapshot del docker-compose.yml
# previo a la integración con Vault). Uso:
#   docker compose -f docker-compose.dev.yml build
#   docker compose -f docker-compose.dev.yml up -d
#
# Para el flujo normal con Vault, usar docker-compose.yml via
# kv-hce-platform-dev/scripts/deploy-mf.sh (lee los build-args desde Vault).
services:
  mf-shell:
    build:
      context: .
      dockerfile: apps/mf-shell/Dockerfile
      args:
        VITE_COMPANY_THEME: csf
        VERDACCIO_URL: http://192.168.42.44:10100
        # URLs de producción — se hornean en el bundle al compilar
        VITE_APIGW_CNL_CROSS: https://servicios.dev.sanfelipe.com:20601
        VITE_REMOTE_AUTH:        https://servicios.dev.sanfelipe.com:20501/assets/remoteEntry.js
        VITE_REMOTE_HOME:        https://servicios.dev.sanfelipe.com:20502/assets/remoteEntry.js
        VITE_REMOTE_EMERGENCY:   https://servicios.dev.sanfelipe.com:20503/assets/remoteEntry.js
        VITE_REMOTE_HOSPITAL:    https://servicios.dev.sanfelipe.com:20504/assets/remoteEntry.js
        VITE_REMOTE_AMBULATORIO: https://servicios.dev.sanfelipe.com:20505/assets/remoteEntry.js
        VITE_REMOTE_AUDITORIA:   https://servicios.dev.sanfelipe.com:20506/assets/remoteEntry.js
        VITE_REMOTE_HEADER:      https://servicios.dev.sanfelipe.com:20507/assets/remoteEntry.js
        VITE_REMOTE_SIDEBAR:     https://servicios.dev.sanfelipe.com:20508/assets/remoteEntry.js
        VITE_REMOTE_FOOTER:      https://servicios.dev.sanfelipe.com:20509/assets/remoteEntry.js
        VITE_REMOTE_TRIAGE:      https://servicios.dev.sanfelipe.com:20510/assets/remoteEntry.js
        VITE_REMOTE_CLINICAL_RECORD: https://servicios.dev.sanfelipe.com:20511/assets/remoteEntry.js
    restart: unless-stopped
    ports:
      - "10500:80"
      - "20500:443"
    environment:
      PORT: "80"
      SSL_PORT: "443"
      USE_SSL: "true"
      CERT_PATH: /proyectos/certs
      NGINX_TYPE: spa
    volumes:
      - /proyectos/certs:/proyectos/certs:ro

  mf-auth:
    build:
      context: .
      dockerfile: apps/mf-auth/Dockerfile
      args:
        VERDACCIO_URL: http://192.168.42.44:10100
        VITE_REMOTE_SHELL: https://servicios.dev.sanfelipe.com:20500/assets/remoteEntry.js
        VITE_APIGW_CNL_CROSS: https://servicios.dev.sanfelipe.com:20601
    restart: unless-stopped
    ports:
