# docker-compose.yml — Build/deploy CON Vault
# Los build-args se leen de variables de entorno, NO hardcodeadas. Deben estar
# exportadas en el shell antes de "docker compose build" — kv-hce-platform-dev/
# scripts/deploy-mf.sh las lee de Vault (paths hce/mf/<servicio>) y las exporta.
#
# Sin Vault disponible (dev local rápido), usar docker-compose.dev.yml en su lugar:
#   docker compose -f docker-compose.dev.yml build && docker compose -f docker-compose.dev.yml up -d
services:
  mf-shell:
    build:
      context: .
      dockerfile: apps/mf-shell/Dockerfile
      args:
        VERDACCIO_URL: ${VERDACCIO_URL}
        # Build-args leídos desde Vault (secret/hce/mf/mf-shell) — ver deploy-mf.sh
        VITE_COMPANY_THEME: ${VITE_COMPANY_THEME}
        VITE_APIGW_CNL_CROSS: ${VITE_APIGW_CNL_CROSS}
        VITE_REMOTE_AUTH: ${VITE_REMOTE_AUTH}
        VITE_REMOTE_HOME: ${VITE_REMOTE_HOME}
        VITE_REMOTE_EMERGENCY: ${VITE_REMOTE_EMERGENCY}
        VITE_REMOTE_HOSPITAL: ${VITE_REMOTE_HOSPITAL}
        VITE_REMOTE_AMBULATORIO: ${VITE_REMOTE_AMBULATORIO}
        VITE_REMOTE_AUDITORIA: ${VITE_REMOTE_AUDITORIA}
        VITE_REMOTE_HEADER: ${VITE_REMOTE_HEADER}
        VITE_REMOTE_SIDEBAR: ${VITE_REMOTE_SIDEBAR}
        VITE_REMOTE_FOOTER: ${VITE_REMOTE_FOOTER}
        VITE_REMOTE_TRIAGE: ${VITE_REMOTE_TRIAGE}
        VITE_REMOTE_CLINICAL_RECORD: ${VITE_REMOTE_CLINICAL_RECORD}
    restart: unless-stopped
    ports:
      - "10500:80"
      - "20500:443"
    environment:
      PORT: "80"
      SSL_PORT: "443"
      USE_SSL: "true"
      CERT_PATH: /proyectos/certs
      NGINX_TYPE: spa
    volumes:
      - /proyectos/certs:/proyectos/certs:ro

  mf-auth:
    build:
      context: .
      dockerfile: apps/mf-auth/Dockerfile
      args:
        VERDACCIO_URL: ${VERDACCIO_URL}
        # Build-args leídos desde Vault (secret/hce/mf/mf-auth)
        VITE_REMOTE_SHELL: ${VITE_REMOTE_SHELL}
        VITE_APIGW_CNL_CROSS: ${VITE_APIGW_CNL_CROSS}
    restart: unless-stopped
