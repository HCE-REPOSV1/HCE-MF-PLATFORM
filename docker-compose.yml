services:
  mf-shell:
    build:
      context: .
      dockerfile: apps/mf-shell/Dockerfile
      args:
        VERDACCIO_URL: http://192.168.42.44:10100
        # URLs de producción — se hornean en el bundle al compilar
        VITE_AUTH_URL: https://servicios.dev.sanfelipe.com:20401
        VITE_REMOTE_AUTH:        https://servicios.dev.sanfelipe.com:20501/assets/remoteEntry.js
        VITE_REMOTE_HOME:        https://servicios.dev.sanfelipe.com:20502/assets/remoteEntry.js
        VITE_REMOTE_EMERGENCY:   https://servicios.dev.sanfelipe.com:20503/assets/remoteEntry.js
        VITE_REMOTE_HOSPITAL:    https://servicios.dev.sanfelipe.com:20504/assets/remoteEntry.js
        VITE_REMOTE_AMBULATORIO: https://servicios.dev.sanfelipe.com:20505/assets/remoteEntry.js
        VITE_REMOTE_AUDITORIA:   https://servicios.dev.sanfelipe.com:20506/assets/remoteEntry.js
        VITE_REMOTE_HEADER:      https://servicios.dev.sanfelipe.com:20507/assets/remoteEntry.js
        VITE_REMOTE_SIDEBAR:     https://servicios.dev.sanfelipe.com:20508/assets/remoteEntry.js
    restart: unless-stopped
    ports:
      - "10500:80"
      - "20500:443"
    environment:
      PORT: "80"
      SSL_PORT: "443"
      USE_SSL: "true"
      CERT_PATH: /proyectos/certs
      NGINX_TYPE: spa
    volumes:
      - /proyectos/certs:/proyectos/certs:ro

  mf-auth:
    build:
      context: .
      dockerfile: apps/mf-auth/Dockerfile
      args:
        VERDACCIO_URL: http://192.168.42.44:10100
        VITE_AUTH_URL: https://servicios.dev.sanfelipe.com:20401
    restart: unless-stopped
    ports:
      - "10501:80"
      - "20501:443"
    environment:
      PORT: "80"
      SSL_PORT: "443"
      USE_SSL: "true"
      CERT_PATH: /proyectos/certs
      NGINX_TYPE: remote
    volumes:
      - /proyectos/certs:/proyectos/certs:ro

  mf-home:
