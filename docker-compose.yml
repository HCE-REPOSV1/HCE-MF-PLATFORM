services:
  mf-shell:
    build:
      context: .
      dockerfile: apps/mf-shell/Dockerfile
      args:
        VERDACCIO_URL: http://${SERVER_IP:-host.docker.internal}:10100
      extra_hosts:
        - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "10300:80"

